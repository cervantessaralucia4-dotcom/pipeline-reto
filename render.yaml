# ═══════════════════════════════════════════════════════════════
#  Render Blueprint — HealthAnalytics IPS
#  Único servicio Django que sirve backend + frontend build
# ═══════════════════════════════════════════════════════════════

services:

  - type: web
    name: healthcare-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build && cd ..
      python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://healthcare-backend-lupa.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://healthcare-backend-lupa.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REACT_APP_API_URL
        value: https://healthcare-backend-lupa.onrender.com/api
    healthCheckPath: /api/health/

databases:
  - name: healthcare-db
    plan: free
    databaseName: healthcare
    ipAllowList: []
